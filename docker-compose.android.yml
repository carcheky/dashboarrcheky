# docker-compose.android.yml
# Build the LunaSea Android APK inside Docker.
#
# Usage (from repo root):
#   docker compose -f docker-compose.android.yml run --rm build
#
# What it does, step by step:
#   1. runs `npm install` (in lunasea/) for husky/commitizen tooling
#   2. runs `npm run generate` (4-stage codegen: env → assets → build_runner → localization)
#   3. runs `flutter build apk --debug`
#
# Outputs:
#   lunasea/build/app/outputs/flutter-apk/app-debug.apk
#
# After the container exits, install the APK on the connected device from the
# WSL host (adb is on the host, not in the container):
#   adb devices
#   adb install -r lunasea/build/app/outputs/flutter-apk/app-debug.apk
#   adb shell am start -n app.lunasea.lunasea.debug/app.lunasea.lunasea.MainActivity

name: lunasea-android

services:
  build:
    build:
      context: .
      dockerfile: Dockerfile.android
    image: lunasea-android-builder:latest
    container_name: lunasea-android-build
    working_dir: /app/lunasea
    volumes:
      # Source code — bind-mounted so edits are picked up live without rebuilding the image.
      - ./lunasea:/app/lunasea
      # Persistent caches so rebuilds are fast. Safe to delete to force a clean rebuild.
      - gradle-cache:/root/.gradle
      - pub-cache:/root/.pub-cache
      # Bind-mount the npm cache too, so we don't redownload node_modules every time.
      - npm-cache:/root/.npm
    environment:
      # Mirror host git config so commits made from inside the container (rare) keep your identity.
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-claude}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-claude@localhost}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-claude}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-claude@localhost}
      # Flutter / Android build env
      - FLUTTER_HOME=/opt/flutter
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      # Build metadata consumed by `environment_config:generate` (declared in
      # lunasea/environment_config.yaml). Upstream CI exports these before
      # codegen — see lunasea/.github/workflows/prepare.yml, job `generate-files`.
      # Without them the generated lib/system/environment.dart falls back to the
      # yaml defaults (build=9999999999, commit=master, flavor=edge) and the
      # app's About screen shows placeholder data.
      # NOTE: interpolation here is intentional and host-side — unlike PATH
      # (see the warning below), these values must come FROM the host.
      # Use scripts/build-android.sh to populate them from git automatically.
      - FLAVOR=${FLAVOR:-edge}
      - COMMIT=${COMMIT:-unknown}
      - BUILD=${BUILD:-9999999999}
    # NOTE: do NOT re-export PATH in `command:`. Compose interpolates `$PATH` on
    # the HOST, so it would replace the container's clean `/opt/flutter/bin:...`
    # PATH with the WSL host's PATH (full of /mnt/c/... and Hermes entries) and
    # break `dart`/`flutter` resolution. The Dockerfile's ENV PATH already has
    # /opt/flutter/bin and /root/.pub-cache/bin, so nothing extra is needed here.
    command: >
      bash -c "
        set -euo pipefail;
        echo '==> [1/4] npm install --ignore-scripts (skip husky prepare; we have no .git/ in container)' &&
        npm install --ignore-scripts --no-audit --no-fund &&
        echo '==> [2/4] npm run generate (4-stage codegen)' &&
        npm run generate &&
        echo '==> [3/4] flutter build apk --debug' &&
        flutter build apk --debug &&
        echo '==> [4/4] done' &&
        echo '' &&
        echo 'APK at: /app/lunasea/build/app/outputs/flutter-apk/app-debug.apk' &&
        ls -lh /app/lunasea/build/app/outputs/flutter-apk/app-debug.apk
      "
    # No network_mode: host — we don't need to talk to the device from inside.
    # The APK is written to a bind-mounted volume and installed from the host.

volumes:
  gradle-cache:
    name: lunasea-gradle-cache
  pub-cache:
    name: lunasea-pub-cache
  npm-cache:
    name: lunasea-npm-cache
