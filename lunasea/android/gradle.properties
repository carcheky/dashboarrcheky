org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
# Phase 1 of ADR-0004: ship .so files compressed inside the APK so the system
# loader extracts them at install time, sidestepping the 16 KB page-size check
# on Android 15+ / Pixel 8/9. Reverted in Phase 2 once AGP/Gradle/Kotlin/NDK
# are bumped so the .so ship uncompressed and properly 16 KB-aligned.
android.bundle.enableUncompressedNativeLibs=false
